    padding: 12px 22px; font-size: 15px; font-weight: 600; border: 0; border-radius: 10px;
    background: linear-gradient(135deg,#0ea5e9,#2563eb); color: #fff; cursor: pointer;
    transition: transform .08s ease, filter .15s ease;
  }
  button.go:hover { filter: brightness(1.08); }
  button.go:active { transform: translateY(1px); }
  .opt { display: flex; align-items: center; gap: 8px; margin: 14px 2px 0; font-size: 14px; color: #cbd5e1; }
  .opt input { width: 16px; height: 16px; accent-color: #38bdf8; }
  #out { margin-top: 22px; }
  .box {
    border-radius: 12px; padding: 16px; font-size: 14px; line-height: 1.7;
    border: 1px solid rgba(148,163,184,.2); background: rgba(2,6,23,.45);
  }
  .ok { border-color: rgba(34,197,94,.5); }
  .wait { border-color: rgba(234,179,8,.5); }
  .err { border-color: rgba(239,68,68,.5); }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; margin-bottom:8px; }
  .tag.ok { background: rgba(34,197,94,.15); color:#4ade80; }
  .tag.wait { background: rgba(234,179,8,.15); color:#facc15; }
  .tag.err { background: rgba(239,68,68,.15); color:#f87171; }
  .kv { color:#94a3b8; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; color:#e2e8f0; }
  .copy {
    margin-top:10px; padding:8px 14px; font-size:13px; border:1px solid rgba(56,189,248,.5);
    border-radius:8px; background:transparent; color:#7dd3fc; cursor:pointer;
  }
  .copy:hover { background: rgba(56,189,248,.12); }
  .spin { display:inline-block; width:14px;height:14px;border:2px solid rgba(250,204,21,.4); border-top-color:#facc15; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes sp { to { transform: rotate(360deg); } }
  footer { color:#94a3b8; font-size:12px; padding: 18px 0 26px; text-align:center; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Docker 镜像转存代理</h1>
      <div class="sub">输入镜像(与 <code>docker pull</code> 写法一致，可加源前缀)。例如：<code>nginx:alpine</code>、<code>library/nginx:1.25</code>、<code>ghcr/nginx/nginx:latest</code>、<code>nginx@sha256:...</code><br>勾选「打包下载」则不转存，直接生成可 <code>docker load</code> 的 tar 文件下载(12 小时有效，到期自动删除)。</div>
      <form id="f">
        <div class="row">
          <input id="img" type="text" placeholder="nginx:alpine" value="nginx:alpine" autocomplete="off" />
          <button class="go" type="submit">转存 / 查询</button>
        </div>
        <label class="opt"><input id="force" type="checkbox" /> 强制更新(覆盖已有转存)</label>
        <label class="opt"><input id="dl" type="checkbox" /> 打包下载(不转存，生成 tar 文件，12 小时后自动删除)</label>
      </form>
      <div id="out"></div>
    </div>
  </div>
  <footer>Copyright ©2026 造物者W</footer>
  <script>
  var out = document.getElementById('out');
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmtSize(n){ n=Number(n)||0; if(n<1024) return n+' B'; var u=['KB','MB','GB','TB'],i=-1; do{n/=1024;i++;}while(n>=1024&&i<u.length-1); return n.toFixed(1)+' '+u[i]; }
  function fmtTime(ms){ if(!ms) return ''; var t=new Date(Number(ms)); function p(x){return String(x).padStart(2,'0');} return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate())+' '+p(t.getHours())+':'+p(t.getMinutes()); }
  function render(d){
    if(d.error){ out.innerHTML = '<div class="box err"><span class="tag err">错误</span><br>'+esc(d.error)+'</div>'; return; }
    if(d.status === 'expired'){
      out.innerHTML = '<div class="box wait"><span class="tag wait">已过期</span><div class="kv" style="margin-top:6px">打包文件已超过 12 小时并被自动删除，请重新勾选「打包下载」提交。</div></div>';
      return;
    }
    // 打包下载就绪：可点击下载 + 原始地址可见(便于复制去拼加速源)
    if(d.status === 'ready' && d.mode === 'download'){
      out.innerHTML = '<div class="box ok"><span class="tag ok">打包完成</span><br>'+
        '<div class="kv">文件：'+esc(d.file_name||'image.tar')+(d.file_size?'('+fmtSize(d.file_size)+')':'')+'</div>'+
        '<div class="kv" style="margin-top:8px">下载地址(点击下载，可复制去拼加速源)：</div>'+
        '<a class="mono" style="color:#7dd3fc" href="'+esc(d.download_url)+'" target="_blank" rel="noopener">'+esc(d.download_url)+'</a>'+
        '<div class="kv" style="margin-top:8px">本地加载：docker load -i '+esc(d.file_name||'image.tar')+'　·　有效期至 '+esc(fmtTime(d.expires_at))+'(本地时间)，到期自动删除</div>'+
        '<button class="copy" data-copy="'+esc(d.download_url)+'">复制下载链接</button></div>';
      bindCopy(); return;
    }
    if(d.status === 'ready'){
      out.innerHTML = '<div class="box ok"><span class="tag ok">已就绪</span><br>'+
        '<div class="kv">源镜像地址：</div><div class="mono">'+esc(d.source_address||d.pull_address)+'</div>'+
        '<div class="kv" style="margin-top:8px">拉取命令：</div><div class="mono">'+esc(d.pull_command)+'</div>'+
        (d.last_error?'<div class="kv" style="margin-top:8px;color:#f87171">覆盖更新失败，当前仍为旧镜像：'+esc(d.last_error)+'</div>':'')+
        '<button class="copy" data-copy="'+esc(d.pull_command)+'">复制拉取命令</button></div>';
      bindCopy(); return;
    }
    if(d.status === 'failed'){
      out.innerHTML = '<div class="box err"><span class="tag err">转存失败</span><br>'+
        '<div class="kv">'+esc(d.error||'转存失败')+'</div>'+
        '<div class="kv" style="margin-top:8px">可修正镜像名或勾选「强制更新」后重新提交重试。</div></div>';
      return;
    }
    var isDl = d.mode === 'download';
    var label = d.status === 'syncing' ? (isDl ? '打包中' : '转存中') : (d.trigger_failed ? '触发失败' : '排队中');
    var tip = d.trigger_failed ? ('<div class="kv" style="margin-top:6px">'+esc(d.trigger_error||'')+'</div>') : '<div class="kv" style="margin-top:6px">'+(isDl?'正在后台拉取镜像并打包为 tar 文件，完成后自动显示下载地址。':'正在后台转存，完成后下方自动显示拉取命令。')+'</div>';
    out.innerHTML = '<div class="box wait"><span class="tag wait">'+label+'</span><span class="spin"></span>'+
      '<div class="kv">状态：'+esc(d.status)+(d.key?'  ·  key: '+esc(d.key):'')+'</div>'+tip+'</div>';
    if(!d.trigger_failed){
      // 轮询间隔收紧到 1.5s(浏览器侧独立请求，无 Workers subrequest 上限顾虑)；
      // 带 cache:'no-store' 防止浏览器/CDN 缓存返回旧状态，回调后更快反映 ready。
      var timer = setInterval(function(){
        fetch('__PREFIX__/status?key='+encodeURIComponent(d.key), {cache:'no-store'}).then(function(s){return s.json();}).then(function(st){
          // 用轮询到的完整状态合并渲染：下载模式可拿到 download_url/expires_at，转存模式拿 last_error
          if(st.status === 'ready'){ clearInterval(timer); render(Object.assign({}, d, st)); }
          else if(st.status === 'failed'){ clearInterval(timer); render({status:'failed', error: st.error}); }
          else if(st.status === 'expired'){ clearInterval(timer); render({status:'expired'}); }
          else { out.querySelector('.box').innerHTML = '<span class="tag wait">'+label+'</span><span class="spin"></span><div class="kv">状态：'+(st.status||'pending')+'</div>'+tip; }
        }).catch(function(){ /* ignore */ });
      }, 1500);
    }
  }
  function bindCopy(){ document.querySelectorAll('.copy').forEach(function(b){ b.addEventListener('click', function(){ navigator.clipboard.writeText(b.getAttribute('data-copy')); b.textContent='已复制 ✓'; setTimeout(function(){b.textContent='复制拉取命令';},1500); }); }); }
  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var image = document.getElementById('img').value.trim();
    var force = document.getElementById('force').checked;
    var dl = document.getElementById('dl').checked;
    if(!image){ out.innerHTML = '<div class="box err"><span class="tag err">提示</span><br>请输入镜像名称</div>'; return; }
    out.innerHTML = '<div class="box wait"><span class="spin"></span> 提交中…</div>';
    fetch('__PREFIX__/api/mirror', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({image:image, force:force, download_only:dl})})
      .then(function(r){ return r.json(); })
      .then(function(d){ render(d); })
      .catch(function(){ out.innerHTML = '<div class="box err"><span class="tag err">错误</span><br>请求失败</div>'; });
  });
  </script>
</body>
</html>`;

// 解析用户输入的镜像引用为 rawName + reference
function parseImageRef(input) {
  input = input.trim();
  let rawName, reference;
  const at = input.indexOf('@');
  if (at !== -1) {
    rawName = input.slice(0, at);
    reference = input.slice(at + 1);
  } else {
    const colon = input.lastIndexOf(':');
    const slash = input.lastIndexOf('/');
    if (colon !== -1 && colon > slash) {
      rawName = input.slice(0, colon);
      reference = input.slice(colon + 1);
    } else {
      rawName = input;
      reference = 'latest';
    }
  }
  return { rawName, reference };
}

// 构造面向用户的「代理拉取地址」：docker pull hub.918178.xyz/<源别名>/<镜像名>:<tag>
// 仅用于 Web 展示与复制，docker 客户端实际仍走 /v2 代理重定向，不会暴露真实 ACR 地址。
function buildHubPullAddress(env, source, imageName, reference, url) {
  const pathPart = source.alias === DEFAULT_SOURCE_ALIAS
    ? imageName.replace(/^library\//, '')   // Docker Hub 默认镜像省略 library/ 前缀，更贴近 docker pull 写法
    : source.registry + '/' + imageName;    // 非 Docker Hub：保留原始 registry 域名前缀，尽量贴近源镜像链接
  const sep = reference.startsWith('sha256:') ? '@' : ':';
  return `${hubDomain(env, url)}/${pathPart}${sep}${reference}`;
}

// GitHub Actions 运行列表展示名：包含 tag；Docker Hub 不显示 dockerhub/ 与 library/ 前缀
function buildDisplayName(source, reference) {
  const name = source.alias === DEFAULT_SOURCE_ALIAS
    ? source.imageName.replace(/^library\//, '')
    : source.registry + '/' + source.imageName;
  const sep = reference.startsWith('sha256:') ? '@' : ':';
  return name + sep + reference;
}

// Web 接口：查询/触发转存并返回面向用户的 docker pull 地址
// - 未强制更新且已存在：直接返回 ready(不重复转存)
// - 未强制更新且不存在/转存中：触发或返回当前状态(前端轮询)
// - 强制更新且已存在：复用原槽位覆盖式重新转存；不存在则正常转存
async function handleMirrorApi(request, env) {
  let body;
  try { body = await request.json(); } catch { return Response.json({ error: 'invalid json' }, { status: 400 }); }
  const image = (body.image || '').trim();
  if (!image) return Response.json({ error: 'missing image' }, { status: 400 });
  const force = !!body.force;
  // 打包下载模式(Web 勾选)：不转存 ACR，触发 workflow 拉取打包为 tar，回调下载地址
  const downloadOnly = !!body.download_only;

  const url = new URL(request.url);
  const { rawName, reference } = parseImageRef(image);
  const source = resolveSource(rawName);
  const acrRepo = source.alias + '/' + source.imageName;
  // 下载模式用 dl: 前缀键，与转存模式 <repo>:<ref> 隔离(不占槽位、互不影响)
  const key = downloadOnly ? downloadKeyOf(acrRepo, reference) : acrRepo + ':' + reference;
  const sitePrefix = env.SITE_PASSWORD ? '/' + env.SITE_PASSWORD : '';
  const pullAddr = buildHubPullAddress(env, source, source.imageName, reference, url);
  // 转存前的源地址(上游 registry 完整引用)，仅用于界面展示，与转存后的拉取地址区分
  const srcAddr = `${source.registry}/${source.imageName}${reference.startsWith('sha256:') ? '@' : ':'}${reference}`;
  const progress = hubBase(env, url) + sitePrefix + '/status?key=' + encodeURIComponent(key);

  async function doTrigger() {
    // 全局限流：超出每小时触发上限直接返回，不消耗 Actions 额度
    const rl = await checkRateLimit(env);
    if (!rl.ok) {
      return {
        status: 'pending',
        key,
        source_address: srcAddr,
        pull_address: pullAddr,
        pull_command: 'docker pull ' + pullAddr,
        progress,
        trigger_failed: true,
        trigger_error: `触发过于频繁：已达每小时上限 ${rl.limit} 次，请稍后再试`,
      };
    }
    // 触发锁去重：并发提交同一 key 时只放行一个触发，其余返回 syncing 由前端轮询
    const locked = await env.DOCKER_KV.get(triggerLockKeyOf(key));
    if (locked !== null) {
      return {
        status: 'syncing',
        key,
        source_address: srcAddr,
        pull_address: pullAddr,
        pull_command: 'docker pull ' + pullAddr,
        progress,
      };
    }
    await env.DOCKER_KV.put(triggerLockKeyOf(key), '1', { expirationTtl: TRIGGER_LOCK_TTL });
    const slot = await allocateSlot(env, key);
    const acrTag = slotTagName(env, slot);
    // 覆盖已有镜像前先备份其 ready 状态：若本次覆盖转存失败需恢复，保证旧镜像仍可拉取、槽位不丢
    // 新增转存(此前非 ready)失败则不留备份，回调时会释放槽位
    if (st && st.status === STATUS.READY) {
      await putStatus(env.DOCKER_KV, BACKUP_PREFIX + key, st, 3600);
    } else {
      await env.DOCKER_KV.delete(BACKUP_PREFIX + key);
    }
    await putStatus(env.DOCKER_KV, key, { status: STATUS.SYNCING, acr_repo: acrRepo, acr_tag: acrTag, updated_at: Date.now() }, 1800);
    let triggerResult = { ok: false, status: 0, detail: '' };
    try { triggerResult = await triggerSync(env, source, reference, acrRepo, acrTag); } catch { triggerResult = { ok: false, status: 0, detail: 'exception' }; }
    const triggered = triggerResult.ok;
    if (!triggered) {
      // 触发失败：立即释放本次占用的槽位，不占用 imageXXX 序号、不留下 map/slot 映射
      await releaseSlot(env, key);
      await putStatus(env.DOCKER_KV, key, { status: STATUS.PENDING, acr_repo: acrRepo, acr_tag: acrTag, updated_at: Date.now() }, 600);
    }
    return {
      status: triggered ? 'syncing' : 'pending',
      key,
      source_address: srcAddr,
      pull_address: pullAddr,
      pull_command: 'docker pull ' + pullAddr,
      progress,
      trigger_failed: !triggered,
      trigger_error: triggered ? null : `GitHub 返回 ${triggerResult.status}: ${triggerResult.detail}`,
    };
  }

  // 打包下载模式触发：不分配 ACR 槽位、不写备份，仅置 syncing 并触发 workflow 的 package job
  async function doTriggerDownload() {
    const rl = await checkRateLimit(env);
    if (!rl.ok) {
      return {
        status: 'pending', mode: 'download', key, source_address: srcAddr, progress,
        trigger_failed: true,
        trigger_error: `触发过于频繁：已达每小时上限 ${rl.limit} 次，请稍后再试`,
      };
    }
    const locked = await env.DOCKER_KV.get(triggerLockKeyOf(key));
    if (locked !== null) {
      return { status: 'syncing', mode: 'download', key, source_address: srcAddr, progress };
    }
    await env.DOCKER_KV.put(triggerLockKeyOf(key), '1', { expirationTtl: TRIGGER_LOCK_TTL });
    await putStatus(env.DOCKER_KV, key, { status: STATUS.SYNCING, mode: 'download', acr_repo: acrRepo, updated_at: Date.now() }, 1800);
    let triggerResult = { ok: false, status: 0, detail: '' };
    try { triggerResult = await triggerSync(env, source, reference, acrRepo, 'download', true); } catch { triggerResult = { ok: false, status: 0, detail: 'exception' }; }
    const triggered = triggerResult.ok;
    if (!triggered) {
      await putStatus(env.DOCKER_KV, key, { status: STATUS.PENDING, mode: 'download', acr_repo: acrRepo, updated_at: Date.now() }, 600);
    }
    return {
      status: triggered ? 'syncing' : 'pending',
      mode: 'download', key, source_address: srcAddr, progress,
      trigger_failed: !triggered,
      trigger_error: triggered ? null : `GitHub 返回 ${triggerResult.status}: ${triggerResult.detail}`,
    };
  }

  let st = await getStatus(env.DOCKER_KV, key);
  st = await guardStale(env.DOCKER_KV, key, st);
  // 打包下载：ready 但已过有效期(文件已被定时任务删除) → 视为不存在，允许重新打包
  if (downloadOnly && isDownloadExpired(st)) st = null;

  // ---- 打包下载模式：已就绪则直接给下载地址；否则触发/等待 ----
  if (downloadOnly) {
    if (st && st.status === STATUS.READY) {
      if (force) return Response.json(await doTriggerDownload());
      return Response.json({
        status: 'ready',
        mode: 'download',
        key,
        source_address: srcAddr,
        download_url: st.download_url || null,
        file_name: st.file_name || null,
        file_size: st.file_size || null,
        file_sha256: st.file_sha256 || null,
        archive_format: st.archive_format || null,
        expires_at: st.expires_at || null,
        progress,
      });
    }
    if (st && st.status === STATUS.SYNCING) {
      return Response.json({ status: 'syncing', mode: 'download', key, source_address: srcAddr, progress });
    }
    // failed / pending / 不存在：显式提交即重新打包
    return Response.json(await doTriggerDownload());
  }

  // 已就绪
  if (st && st.status === STATUS.READY) {
    if (force) {
      // 强制更新：复用原槽位覆盖式重新转存
      return Response.json(await doTrigger());
    }
    return Response.json({
      status: 'ready',
      key,
      source_address: srcAddr,
      pull_address: pullAddr,
      pull_command: 'docker pull ' + pullAddr,
      last_error: st.last_error || null,
      progress,
    });
  }

  // 转存中(强制更新也无需重复触发)
  if (st && st.status === STATUS.SYNCING) {
    return Response.json({
      status: 'syncing',
      key,
      source_address: srcAddr,
      pull_address: pullAddr,
      pull_command: 'docker pull ' + pullAddr,
      progress,
    });
  }

  // 转存失败(上游错误/回调失败)：显式提交即视为重试，直接重新触发，
  // 避免上一次的旧错误(如已修好的 flag 问题)长期残留、必须勾「强制更新」才能重跑。
  if (st && st.status === STATUS.FAILED) {
    return Response.json(await doTrigger());
  }

  // 未转存(pending / 不存在)
  return Response.json(await doTrigger());
}

// ---- 入口 ----

// 进度查询(根路径 /status 与密码子路径 /<pwd>/status 共用)
async function handleStatus(env, url) {
  const key = decodeURIComponent(url.searchParams.get('key') || '');
  let st = key ? await getStatus(env.DOCKER_KV, key) : null;
  st = await guardStale(env.DOCKER_KV, key, st);
  // 打包下载：文件已过 12 小时有效期并被自动删除，向前端明示，引导重新打包
  const hdrs = { 'Content-Type': 'application/json', 'Cache-Control': 'no-store' };
  if (isDownloadExpired(st)) {
    return Response.json({ status: 'expired', mode: 'download', key, expires_at: st.expires_at }, {
      headers: hdrs,
    });
  }
  return Response.json(st || { status: STATUS.PENDING }, {
    headers: hdrs,
  });
}

async function route(request, env) {
    const url = new URL(request.url);
    const method = request.method;
    let path = url.pathname;

    // 1. /v2 探活：声明支持 Registry API V2(registry 始终开放，不受密码限制)
    if (path === '/v2' || path === '/v2/') {
      return new Response('{}', {
        status: 200,
        headers: {
          'Docker-Distribution-Api-Version': 'registry/2.0',
          'Content-Type': 'application/json',
        },
      });
    }

    // 2. 内部回调(GitHub Actions 调用，凭共享密钥校验，始终开放)
    if (path === '/internal/callback' && method === 'POST') {
      return handleCallback(request, env);
    }

    // 3. 进度查看(registry 503 中的链接会用到，始终保持根路径开放)
    if (path === '/status' && method === 'GET') {
      return handleStatus(env, url);
    }

    // 4. 密码保护(仅作用于 Web 界面与触发接口；子路径形式，如 /zwzw)
    //    registry 的 /v2/... 必须放行：docker 客户端无法携带密码子路径，
    //    一旦被拦截会 302 跳到伪装站，导致把伪装页面当镜像层下载(大小校验失败 / EOF)。
    const sitePassword = env.SITE_PASSWORD ? String(env.SITE_PASSWORD).trim() : '';
    const sitePrefix = sitePassword ? '/' + sitePassword : '';
    const isRegistryPath = path.startsWith('/v2/');
    if (sitePrefix && !isRegistryPath) {
      const ok = path === sitePrefix || path.startsWith(sitePrefix + '/');
      if (!ok) {
        // 未命中密码子路径：跳转伪装链接(未配置 CAMOUFLAGE_URL 时用默认伪装站)
        return Response.redirect(camouflageUrl(env), 302);
      }
      path = path.slice(sitePrefix.length) || '/';
    }

    // 5. Web 界面与接口(路径已剥离前缀)
    if ((path === '/' || path === '/ui') && method === 'GET') {
      // 注入密码子路径前缀：页面内的 api/status 请求必须同样带前缀，
      // 否则会被判为未授权而 302 跳到伪装站，导致跨域(CORS)失败。
      const html = HOME_HTML.replace(/__PREFIX__/g, sitePrefix);
      return new Response(html, { headers: { 'Content-Type': 'text/html; charset=utf-8' } });
    }
    // 带密码前缀时的进度查询(如 /zwzw/status)，剥离前缀后在此命中
    if (path === '/status' && method === 'GET') {
      return handleStatus(env, url);
    }
    if (path === '/api/mirror' && method === 'POST') {
      return handleMirrorApi(request, env);
    }

    // 6. Registry V2 请求(/v2/... 始终开放)
    //    tags/list：crane / containerd / ctr 等客户端会请求；本服务不维护 tag 列表，
    //    返回空列表满足协议形状(docker pull 主流程不经过该接口)。
    const tagsM = path.match(/^\/v2\/(.+)\/tags\/list$/);
    if (tagsM && method === 'GET') {
      return Response.json({ name: tagsM[1], tags: [] }, {
        headers: { 'Docker-Distribution-Api-Version': 'registry/2.0', 'Content-Type': 'application/json' },
      });
    }
    const parsed = parseRegistryPath(path);
    if (!parsed) {
      return new Response('Not Found', { status: 404 });
    }

    const source = resolveSource(parsed.rawName);
    const acrRepo = `${source.alias}/${source.imageName}`;
    const key = `${acrRepo}:${parsed.reference}`;

    if (parsed.type === 'manifests') {
      return handleManifest(env, source, parsed.reference, key, acrRepo, url, method);
    }
    if (parsed.type === 'blobs') {
      return handleBlob(env, parsed.reference, acrRepo);
    }

    return new Response('Not Found', { status: 404 });
  }

export default {
  async fetch(request, env) {
    // 入口守卫：KV 绑定缺失时给出明确可操作的报错，而不是 cryptic 的 "reading 'get'"
    if (!env || !env.DOCKER_KV) {
      return Response.json(
        {
          error:
            'KV 绑定 DOCKER_KV 未配置',
        },
        { status: 500, headers: { 'Content-Type': 'application/json' } },
      );
    }
    try {
      return await route(request, env);
    } catch (e) {
      return Response.json(
        { error: (e && e.message) || String(e), stack: e && e.stack },
        { status: 500, headers: { 'Content-Type': 'application/json' } }
      );
    }
  },
};
