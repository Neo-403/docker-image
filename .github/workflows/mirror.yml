name: Mirror Docker Image
# 运行列表直接显示正在转存的镜像与槽位，便于排查问题
run-name: "${{ github.event.inputs.display_name }} -> ${{ github.event.inputs.acr_tag }}"

# 由 Cloudflare Workers 通过 workflow_dispatch 触发
#  inputs:
#   source_alias    : 源缩写（dockerhub / ghcr / quay ...），用于 ACR tag 前缀
#   source_registry : 上游 registry（如 docker.io / ghcr.io / quay.io）
#   image_name      : 上游镜像名（如 library/nginx / bitnami/nginx / nginx）
#   image_ref       : Tag（如 latest）或 digest（sha256:...）
#   acr_repo        : 逻辑仓库标识（含源别名前缀，仅用于回调 KV key，如 dockerhub/library/nginx）
#   acr_repo_name   : 单一物理 ACR 仓库名（所有镜像统一推送到此，由 Worker 的 ACR_REPO 注入）
on:
  workflow_dispatch:
    inputs:
      source_registry:
        description: '上游 registry，如 docker.io / ghcr.io / quay.io'
        required: true
      image_name:
        description: '上游镜像名，如 library/nginx 或 bitnami/nginx 或 nginx'
        required: true
      image_ref:
        description: 'Tag（如 latest）或 digest（sha256:...）'
        required: true
      acr_repo:
        description: '逻辑仓库标识（含源别名前缀，用于回调 KV key）'
        required: true
      acr_repo_name:
        description: '单一物理 ACR 仓库名（所有镜像统一推送目标）'
        required: true
      acr_tag:
        description: '目标槽位 tag（如 image037），由 Worker 分配'
        required: true
      display_name:
        description: '运行列表展示名（含 tag；Docker Hub 不带 dockerhub/、library/ 前缀）'
        required: false
        default: ''

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 用缓存安装 skopeo / jq：命中缓存时直接复用，跳过 apt-get update + 下载，显著缩短启动耗时
      - name: 安装依赖 (skopeo / jq，带缓存)
        uses: awalsh128/cache-apt-pkgs-action@v1.5.1
        with:
          packages: skopeo jq
          version: 1.0

      - name: 构造源/目标引用
        id: ref
        env:
          REF: ${{ github.event.inputs.image_ref }}
          SRC_REG: ${{ github.event.inputs.source_registry }}
          NAME: ${{ github.event.inputs.image_name }}
          ACR_REPO_NAME: ${{ github.event.inputs.acr_repo_name }}
          ACR_TAG: ${{ github.event.inputs.acr_tag }}
          REG: ${{ secrets.ACR_REGISTRY }}
          NS: ${{ secrets.ACR_NAMESPACE }}
        run: |
          if [[ "$REF" == sha256:* ]]; then SEP="@"; else SEP=":"; fi
          # 目标 tag 由 Worker 分配的固定槽位（image001..imageN），直接复用
          echo "src=${SRC_REG}/${NAME}${SEP}${REF}"            >> "$GITHUB_OUTPUT"
          echo "dest=${REG}/${NS}/${ACR_REPO_NAME}:${ACR_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${ACR_TAG}"                                >> "$GITHUB_OUTPUT"

      - name: 登录阿里云 ACR
        run: |
          skopeo login "${{ secrets.ACR_REGISTRY }}" \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password "${{ secrets.ACR_PASSWORD }}"

      - name: 转存镜像 (skopeo copy)
        id: copy
        env:
          SRC: docker://${{ steps.ref.outputs.src }}
          DEST: docker://${{ steps.ref.outputs.dest }}
        run: |
          echo "Copy: $SRC -> $DEST"
          # 捕获 skopeo 错误日志，失败时随回调带回，便于前端展示真实原因；--retry-times 应对上游瞬时抖动（旧版 skopeo 不支持 --retry-delay，故省略）
          if ! skopeo copy --retry-times 3 "$SRC" "$DEST" 2> skopeo_err.log; then
            ERR_LINE=$(tail -n 5 skopeo_err.log 2>/dev/null | tr '\n' ' ' | tr -s ' ' | cut -c1-300)
            echo "SKOPEO_ERR=$ERR_LINE" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: 收集完整 digest 列表（index -> 平台 manifest -> layer/config）
        if: steps.copy.outcome == 'success'
        id: blobs
        env:
          SRC: ${{ steps.ref.outputs.src }}
          SRC_REG: ${{ github.event.inputs.source_registry }}
          NAME: ${{ github.event.inputs.image_name }}
        run: |
          TOP=$(skopeo inspect --raw "docker://$SRC" 2>/dev/null)
          # 顶层：index 取各平台 manifest digest；单架构取 layer/config digest
          DIGESTS=$(echo "$TOP" | jq -r '
            if (.manifests | type) == "array" then
              .manifests[].digest
            else
              (.layers[]? | .digest // empty), (.config.digest // empty)
            end' 2>/dev/null)

          # 多架构：下钻每个平台 manifest，收集其 layer/config digest
          if echo "$TOP" | jq -e '(.manifests | type) == "array"' >/dev/null 2>&1; then
            for d in $(echo "$TOP" | jq -r '.manifests[].digest'); do
              PLAT=$(skopeo inspect --raw "docker://${SRC_REG}/${NAME}@${d}" 2>/dev/null)
              DIGESTS="$DIGESTS"$'\n'"$(echo "$PLAT" | jq -r '(.layers[]? | .digest // empty), (.config.digest // empty)' 2>/dev/null)"
            done
          fi

          DIGESTS=$(echo "$DIGESTS" | sort -u | sed '/^$/d')
          {
            echo "digests<<EOF"
            echo "$DIGESTS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 回调 Workers（成功 -> ready）
        if: success()
        env:
          URL: ${{ secrets.CALLBACK_URL }}
          TOKEN: ${{ secrets.CALLBACK_TOKEN }}
          ACR_REPO: ${{ github.event.inputs.acr_repo }}
          REF: ${{ github.event.inputs.image_ref }}
          DIGESTS: ${{ steps.blobs.outputs.digests }}
        run: |
          BLOBS_JSON=$(jq -R -s 'split("\n") | map(select(length>0))' <<< "$DIGESTS")
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Token: $TOKEN" \
            -d "$(jq -n \
                  --arg repo "$ACR_REPO" \
                  --arg ref "$REF" \
                  --argjson blobs "$BLOBS_JSON" \
                  '{acr_repo:$repo, image_ref:$ref, status:"ready", blobs:$blobs}')"

      - name: 回调 Workers（失败 -> failed，携带原因）
        if: failure()
        env:
          URL: ${{ secrets.CALLBACK_URL }}
          TOKEN: ${{ secrets.CALLBACK_TOKEN }}
          ACR_REPO: ${{ github.event.inputs.acr_repo }}
          REF: ${{ github.event.inputs.image_ref }}
          ERR: ${{ steps.copy.outputs.SKOPEO_ERR }}
        run: |
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Token: $TOKEN" \
            -d "$(jq -n \
                  --arg repo "$ACR_REPO" \
                  --arg ref "$REF" \
                  --arg err "${ERR:-skopeo 转存失败（无详细日志）}" \
                  '{acr_repo:$repo, image_ref:$ref, status:"failed", error:$err}')"
